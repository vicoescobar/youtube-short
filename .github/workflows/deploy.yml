name: CI/CD Auto-Deploy to VPS (Native)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to OVH VPS
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement automatique via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            # 1. Charger tous les chemins possibles dans le PATH
            export PATH="$HOME/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

            echo "🚀 Démarrage du déploiement sur le VPS..."
            echo "👤 Utilisateur connecté : $(whoami)"

            # 2. Définir le dossier cible à partir du secret SSH_TARGET_DIR
            PROJECT_DIR="${{ secrets.SSH_TARGET_DIR || '/home/victor-giroud-ytshorts/youtube-short' }}"
            echo "📁 Dossier de déploiement : $PROJECT_DIR"

            # 3. Cloner le projet si nécessaire
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📦 Premier déploiement : Clonage du dépôt..."
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # 4. Mettre à jour le code depuis main
            echo "📥 Mise à jour du code..."
            git fetch origin main
            git reset --hard origin/main

            # 5. S'assurer de la présence du fichier .env
            if [ ! -f .env ]; then
              echo "⚠️ Fichier .env manquant. Création depuis .env.example..."
              cp .env.example .env
            fi

            # 6. S'assurer que uv est installé (ultra-rapide, sans root)
            if ! command -v uv &> /dev/null; then
              echo "⚡ Installation de uv..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi

            # 7. Synchroniser les dépendances Python
            echo "🐍 Installation / mise à jour des dépendances Python..."
            uv sync --no-dev

            # 8. Build du frontend Vue 3
            if command -v npm &> /dev/null; then
              echo "🎨 Build du frontend Vue 3..."
              cd frontend
              npm install
              npm run build
              cd ..
            fi

            # 9. Relancer le serveur FastAPI sur le port 8000
            echo "🔄 Redémarrage du serveur FastAPI..."
            if command -v pm2 &> /dev/null; then
              pm2 restart shorts-studio 2>/dev/null || pm2 start "uv run uvicorn src.api:app --host 127.0.0.1 --port 8000" --name shorts-studio
              pm2 save
            else
              # Fallback avec gestion de processus propre (nohup & pid)
              pkill -u $(whoami) -f "uvicorn src.api:app" 2>/dev/null || true
              sleep 1
              nohup uv run uvicorn src.api:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
              echo $! > app.pid
            fi

            echo "✅ Déploiement terminé avec succès ! Le serveur écoute sur 127.0.0.1:8000."
