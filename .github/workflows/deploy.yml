name: Build & Deploy to VPS (CloudPanel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Sync to CloudPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Vue Dashboard project
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to CloudPanel via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          # Enregistrer l'empreinte de la clé du VPS
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          # Synchroniser les fichiers backend et le frontend compilé vers le VPS
          # Exclut les rushs, les vidéos générées et les fichiers d'environnement
          rsync -avz --no-owner --no-group \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'output' \
            --exclude 'temp' \
            --exclude 'cookies.txt' \
            --exclude '*cookies*.txt' \
            --exclude 'frontend/node_modules' \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new" \
            ./ "$SSH_USER@$SSH_HOST:$TARGET_DIR"

      - name: Restart FastAPI Server on VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            cd "${{ secrets.SSH_TARGET_DIR }}"

            echo "🚀 Mise à jour et démarrage du serveur..."

            # 1. S'assurer que uv est installé (ultra-rapide, sans root)
            if ! command -v uv &> /dev/null; then
              echo "⚡ Installation de uv dans ~/.local/bin..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi

            # 2. Synchroniser les dépendances Python dans l'environnement virtuel
            echo "🐍 Installation des dépendances Python..."
            uv sync --no-dev

            # 3. S'assurer de la présence du fichier .env
            if [ ! -f .env ]; then
              echo "⚠️ Création d'un .env template..."
              cp .env.example .env
            fi

            # 4. Redémarrage propre du serveur FastAPI sur le port 8000
            echo "🔄 Redémarrage du serveur Shorts Studio sur le port 8000..."
            pkill -u $(whoami) -f "uvicorn src.api:app" 2>/dev/null || true
            sleep 1
            nohup uv run uvicorn src.api:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
            echo $! > app.pid

            echo "✅ Déploiement terminé avec succès ! Le serveur écoute sur 127.0.0.1:8000."
          EOF
